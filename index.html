<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#EEF0F6; --text:#13161F; --text-dim:#63697A;
  --border:#E2E5EE; --accent:#5B4CFF; --accent-ink:#FFFFFF; --accent-soft:#EEEBFF;
  --danger:#E5484D; --success:#0FA36B; --radius:14px;
  --font-head:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E14; --surface:#151824; --surface-2:#1B1F2E; --text:#EEF0F7; --text-dim:#8B90A3;
    --border:#262B3D; --accent:#8C7DFF; --accent-ink:#0C0E14; --accent-soft:#242142;
    --danger:#FF6B6E; --success:#3DDC9A;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E14; --surface:#151824; --surface-2:#1B1F2E; --text:#EEF0F7; --text-dim:#8B90A3;
  --border:#262B3D; --accent:#8C7DFF; --accent-ink:#0C0E14; --accent-soft:#242142;
  --danger:#FF6B6E; --success:#3DDC9A;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand{font-family:var(--font-head);}
button{font-family:inherit;}
a{color:var(--accent);}
.container{max-width:1180px;margin:0 auto;padding:0 20px;}

/* header */
header.top{
  position:sticky; top:0; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.top-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 20px;}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem;}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex-shrink:0;}
.brand .mark svg{width:16px;height:16px;}
.top-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.15s;
}
.icon-btn:hover{border-color:var(--accent);}
.icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}

/* hero */
.hero{padding:36px 20px 8px; text-align:center;}
.hero h1{font-size:clamp(1.6rem,3.4vw,2.3rem); margin:0 0 8px; font-weight:700;}
.hero p{color:var(--text-dim); margin:0 auto; max-width:520px; font-size:1rem;}

/* layout */
.app{display:grid; grid-template-columns:220px 1fr 340px; gap:18px; padding:28px 20px 60px; max-width:1180px; margin:0 auto; align-items:start;}

/* type sidebar (desktop) */
.type-sidebar{display:flex; flex-direction:column; gap:6px; position:sticky; top:80px;}
.type-btn{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:1px solid transparent;
  background:transparent; color:var(--text-dim); cursor:pointer; text-align:left; font-size:.92rem; font-weight:500;
}
.type-btn svg{width:18px;height:18px;flex-shrink:0;}
.type-btn:hover{background:var(--surface-2); color:var(--text);}
.type-btn[aria-selected="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600;}

/* type tabs (mobile/tablet) */
.type-tabs{display:none; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.type-tabs::-webkit-scrollbar{height:0;}
@media (max-width:1024px){ .type-tabs{display:flex;} }
@media (max-width:1024px){ .app{grid-template-columns:1fr 320px;} .type-sidebar{display:none;} }
@media (max-width:760px){ .app{grid-template-columns:1fr; gap:16px;} }
.type-chip{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:999px;
  border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:.85rem; font-weight:500; cursor:pointer;
}
.type-chip svg{width:15px;height:15px;}
.type-chip[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

/* cards */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
.card + .card{margin-top:16px;}
.card h2{font-size:1rem; margin:0 0 14px;}
label{display:block; font-size:.82rem; font-weight:600; margin-bottom:6px; color:var(--text-dim);}
.field-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.field-top label{margin-bottom:6px; flex:1;}
.char-count{font-size:.74rem; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap;}
.char-count.near-limit{color:var(--danger); font-weight:600;}
.field.valid input, .field.valid textarea{border-color:var(--success);}
.field{margin-bottom:14px;}
input[type=text], input[type=url], input[type=tel], input[type=email], input[type=password], select, textarea{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:.92rem; font-family:inherit;
}
textarea{resize:vertical; min-height:80px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.phone-group{display:flex; align-items:stretch; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); overflow:hidden; transition:border-color .15s;}
.phone-group:focus-within{border-color:var(--accent); outline:2px solid var(--accent); outline-offset:1px;}
.phone-group.invalid{border-color:var(--danger);}
.phone-group.valid{border-color:var(--success);}
.phone-plus{display:flex; align-items:center; padding:0 2px 0 12px; color:var(--text-dim); font-weight:600; font-size:.92rem;}
.phone-group input{border:none; background:transparent; font-size:.92rem; font-family:inherit; color:var(--text); padding:10px 8px; width:auto;}
.phone-group input:focus{outline:none;}
.phone-group input.phone-cc{width:56px; flex:none; text-align:left;}
.phone-group input.phone-num{flex:1 1 auto; min-width:0; width:auto;}
.phone-sep{width:1px; background:var(--border); margin:8px 0; flex:none;}
.row-cc{display:grid; grid-template-columns:90px 1fr; gap:10px;}
.err{color:var(--danger); font-size:.78rem; margin-top:4px; display:none;}
.field.invalid input, .field.invalid select{border-color:var(--danger);}
.field.invalid .err{display:block;}
.check{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--text); font-weight:500; margin-bottom:14px;}
.check input{width:16px;height:16px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:10px;
  background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:.92rem; border:none; cursor:pointer; transition:.15s; width:100%;
}
.btn:hover{opacity:.9;}

/* Conteúdo SEO e Rodapé */
.seo-section {max-width:800px; margin: 40px auto; padding: 20px; font-size: 0.95rem; line-height: 1.6; color: var(--text-dim);}
.seo-section h2 {color: var(--text); font-size: 1.4rem; margin-top: 24px;}
footer.site-footer {text-align: center; padding: 30px 20px; border-top: 1px solid var(--border); margin-top: 40px; font-size: 0.85rem; color: var(--text-dim);}
footer.site-footer a {margin: 0 10px; text-decoration: none;}
footer.site-footer a:hover {text-decoration: underline;}

/* Modal de Políticas */
.modal {display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 20px;}
.modal:target {display: flex;}
.modal-content {background: var(--surface); border: 1px solid var(--border); padding: 30px; border-radius: var(--radius); max-width: 600px; max-height: 80vh; overflow-y: auto; position: relative;}
.modal-close {position: absolute; top: 15px; right: 15px; font-size: 1.2rem; text-decoration: none; color: var(--text);}
</style>
</head>

  <div class="top-inner">
    <div class="brand">
      <div class="mark">
